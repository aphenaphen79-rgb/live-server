<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUDANG BAJU ENTER</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
    body { font-family: Arial; padding: 10px; background: #e1f5fe; }
    h1 { color: #0277BD; text-align: center; }
.card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px #ccc; }
    input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #90CAF9; font-size: 15px; box-sizing: border-box; }
    button { background: #0277BD; color: white; border: none; font-weight: bold; }
    button.masuk { background: #2E7D32; }
    button.logout { background: #424242; }
    button.ganti { background: #FF9800; }
    table { border-collapse: collapse; width: 100%; background: white; overflow-x: auto; display: block; }
    td, th { border: 1px solid #ddd; padding: 8px; font-size: 12px; white-space: nowrap; }
    th { background: #0277BD; color: white; }
.hidden { display: none; }
.login-box { max-width: 400px; margin: 50px auto; }
.info { font-size: 12px; color: #0277BD; text-align: center; }
input:focus, select:focus { border: 2px solid #0277BD; background: #E3F2FD; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-box card">
    <h1>🔐 LOGIN GUDANG</h1>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">MASUK</button>
    <p class="info">ENTER = Pindah Bawah | ENTER terakhir = Login</p>
</div>

<!-- MAIN -->
<div id="mainPage" class="hidden">
<h1>👕 DATA GUDANG BAJU</h1>
<button class="logout" onclick="logout()">LOGOUT</button>
<button class="ganti" onclick="showGantiSandi()">GANTI PASSWORD</button>

<div id="formGanti" class="card hidden">
    <h3>Ganti Password</h3>
    <input type="password" id="passLama" placeholder="Password Lama">
    <input type="password" id="passBaru" placeholder="Password Baru">
    <input type="password" id="passBaru2" placeholder="Ulangi Password Baru">
    <button onclick="gantiPassword()">SIMPAN PASSWORD BARU</button>
    <p class="info">ENTER = Pindah Bawah | ENTER terakhir = Simpan</p>
</div>

<div class="card">
    <h3>Input Pemasukan / Pengeluaran</h3>
    <input type="text" id="namaBaju" placeholder="1. Nama Baju">
    <input type="number" id="jumlah" placeholder="2. Jumlah lusinan">
    <select id="jenis">
        <option value="PEMASUKAN">3. PEMASUKAN BARANG</option>
        <option value="PENGELUARAN">3. PENGELUARAN BARANG</option>
    </select>
    <input type="text" id="keterangan" placeholder="4. Keterangan">
    <button class="masuk" id="btnSimpan" onclick="simpanData()">SIMPAN DATA</button>
    <p class="info">ENTER = Pindah Bawah | ENTER terakhir = Simpan</p>
</div>

<div class="card">
    <button onclick="tampilkanData()">LIHAT DATA</button>
    <button onclick="tampilkanRekap()">REKAP STOK</button>
    <button onclick="downloadExcel()">DOWNLOAD EXCEL + META</button>
    <button style="background:#C62828" onclick="hapusData()">HAPUS SEMUA</button>
</div>

<div id="hasil"></div>
</div>

<script>
let dataGudang = [];
let userData = { username: "admin", password: "1234" };
let userLogin = "admin";

// Load data
window.onload = function() {
    const savedData = localStorage.getItem('dataGudangBajuEnter2');
    const savedUser = localStorage.getItem('userGudangBajuEnter2');
    if(savedData) dataGudang = JSON.parse(savedData);
    if(savedUser) userData = JSON.parse(savedUser);
    if(localStorage.getItem('isLoginBajuEnter2') === 'true') showMain();
    setEnterPindah(); // Aktifin enter pindah
}

// FUNGSI ENTER PINDAH KE BAWAH
function setEnterPindah() {
    // DAFTAR INPUT LOGIN
    const loginInputs = [document.getElementById('username'), document.getElementById('password')];
    loginInputs.forEach((input, i) => {
        input.addEventListener('keydown', function(e) {
            if(e.key === 'Enter') {
                e.preventDefault();
                if(i < loginInputs.length - 1) loginInputs[i+1].focus(); // pindah bawah
                else login(); // terakhir = submit
            }
        });
    });

    // DAFTAR INPUT GANTI PASSWORD
    const gantiInputs = [document.getElementById('passLama'), document.getElementById('passBaru'), document.getElementById('passBaru2')];
    gantiInputs.forEach((input, i) => {
        input.addEventListener('keydown', function(e) {
            if(e.key === 'Enter') {
                e.preventDefault();
                if(i < gantiInputs.length - 1) gantiInputs[i+1].focus();
                else gantiPassword();
            }
        });
    });

    // DAFTAR INPUT UTAMA
    const mainInputs = [document.getElementById('namaBaju'), document.getElementById('jumlah'), document.getElementById('jenis'), document.getElementById('keterangan')];
    mainInputs.forEach((input, i) => {
        input.addEventListener('keydown', function(e) {
            if(e.key === 'Enter') {
                e.preventDefault();
                if(i < mainInputs.length - 1) mainInputs[i+1].focus();
                else simpanData();
            }
        });
    });
}

function login() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    if(u === userData.username && p === userData.password) {
        userLogin = u;
        localStorage.setItem('isLoginBajuEnter2', 'true');
        showMain();
    } else { alert("Username/Password salah!"); }
}

function logout() {
    localStorage.setItem('isLoginBajuEnter2', 'false');
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('mainPage').classList.add('hidden');
}

function showMain() {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    document.getElementById('namaBaju').focus();
}

function showGantiSandi() {
    document.getElementById('formGanti').classList.toggle('hidden');
    if(!document.getElementById('formGanti').classList.contains('hidden')) {
        document.getElementById('passLama').focus();
    }
}

function gantiPassword() {
    const lama = document.getElementById('passLama').value;
    const baru = document.getElementById('passBaru').value;
    const baru2 = document.getElementById('passBaru2').value;
    if(lama!== userData.password) return alert("Password lama salah!");
    if(baru === "") return alert("Password baru tidak boleh kosong!");
    if(baru!== baru2) return alert("Password baru tidak sama!");
    userData.password = baru;
    localStorage.setItem('userGudangBajuEnter2', JSON.stringify(userData));
    alert("✅ Password berhasil diganti!");
    document.getElementById('formGanti').classList.add('hidden');
}

function getWaktu() {
    const now = new Date();
    return {
        tanggal: now.toLocaleDateString('id-ID'),
        jam: now.toLocaleTimeString('id-ID'),
        hari: ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][now.getDay()]
    };
}

function simpanData() {
    const {tanggal, jam, hari} = getWaktu();
    const nama = document.getElementById('namaBaju').value;
    const jumlah = parseInt(document.getElementById('jumlah').value);
    const jenis = document.getElementById('jenis').value;
    const ket = document.getElementById('keterangan').value;
    if(nama === "" ||!jumlah) return alert("Nama Baju dan Jumlah wajib diisi!");

    dataGudang.push({
        TANGGAL: tanggal, JAM: jam, HARI: hari,
        JENIS: jenis, NAMA_BAJU: nama,
        MASUK: jenis === 'PEMASUKAN'? jumlah : 0,
        KELUAR: jenis === 'PENGELUARAN'? jumlah : 0,
        KETERANGAN: ket, INPUT_OLEH: userLogin
    });
    localStorage.setItem('dataGudangBajuEnter2', JSON.stringify(dataGudang));
    alert("✅ Data berhasil disimpan");

    document.getElementById('namaBaju').value = "";
    document.getElementById('jumlah').value = "";
    document.getElementById('keterangan').value = "";
    document.getElementById('namaBaju').focus(); // balik ke atas
}

function tampilkanData() {
    if(dataGudang.length === 0) return document.getElementById('hasil').innerHTML = "<p>Belum ada data</p>";
    let stok = {};
    let dataDenganSisa = dataGudang.map(item => {
        if(!stok[item.NAMA_BAJU]) stok[item.NAMA_BAJU] = 0;
        stok[item.NAMA_BAJU] += item.MASUK - item.KELUAR;
        return {...item, SISA_STOK: stok[item.NAMA_BAJU]};
    });
    document.getElementById('hasil').innerHTML = "<h3>RIWAYAT TRANSAKSI</h3>" + XLSX.utils.sheet_to_html(XLSX.utils.json_to_sheet(dataDenganSisa));
}

function tampilkanRekap() {
    if(dataGudang.length === 0) return document.getElementById('hasil').innerHTML = "<p>Belum ada data</p>";
    let rekap = {};
    dataGudang.forEach(item => {
        if(!rekap[item.NAMA_BAJU]) rekap[item.NAMA_BAJU] = {TOTAL_MASUK: 0, TOTAL_KELUAR: 0};
        rekap[item.NAMA_BAJU].TOTAL_MASUK += item.MASUK;
        rekap[item.NAMA_BAJU].TOTAL_KELUAR += item.KELUAR;
    });
    let dataRekap = [];
    for(let nama in rekap) {
        let sisa = rekap[nama].TOTAL_MASUK - rekap[nama].TOTAL_KELUAR;
        dataRekap.push({
            NAMA_BAJU: nama, TOTAL_PEMASUKAN: rekap[nama].TOTAL_MASUK,
            TOTAL_PENGELUARAN: rekap[nama].TOTAL_KELUAR, SISA_STOK: sisa,
            STATUS: sisa <= 0? "STOK HABIS" : sisa <= 10? "STOK TIPIS" : "AMAN"
        });
    }
    document.getElementById('hasil').innerHTML = "<h3>REKAP STOK</h3>" + XLSX.utils.sheet_to_html(XLSX.utils.json_to_sheet(dataRekap));
}

function downloadExcel() {
    if(dataGudang.length === 0) return alert("Data masih kosong!");
    let stok = {};
    let dataDenganSisa = dataGudang.map(item => {
        if(!stok[item.NAMA_BAJU]) stok[item.NAMA_BAJU] = 0;
        stok[item.NAMA_BAJU] += item.MASUK - item.KELUAR;
        return {...item, SISA_STOK: stok[item.NAMA_BAJU]};
    });
    const wsData = XLSX.utils.json_to_sheet(dataDenganSisa, {origin: "A6"});
    XLSX.utils.sheet_add_aoa(wsData, [
        ["LAPORAN GUDANG BAJU PRO"],
        ["Dicetak Oleh", ": " + userLogin],
        ["Dicetak Tanggal", ": " + new Date().toLocaleString('id-ID')],
        ["Total Transaksi", ": " + dataGudang.length + " Data"],
        []
    ], {origin: "A1"});
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsData, "Data Gudang");
    XLSX.writeFile(wb, "Laporan_Gudang_Baju.xlsx");
}

function hapusData() {
    if(confirm("Yakin hapus semua data?")) {
        dataGudang = [];
        localStorage.removeItem('dataGudangBajuEnter2');
        document.getElementById('hasil').innerHTML = "";
    }
}
</script>
</body>
</html>
